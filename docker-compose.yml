services:
  db:
    image: m.daocloud.io/docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: usamis
      POSTGRES_USER: usamis_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - usamis-db:/var/lib/postgresql/data
      - ./java/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./java/src/main/resources/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./java/src/main/resources/03-demo-passwords.sql:/docker-entrypoint-initdb.d/03-demo-passwords.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usamis_user -d usamis"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./java
    environment:
      DB_URL: jdbc:postgresql://db:5432/usamis
      DB_USER: usamis_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  usamis-db:
